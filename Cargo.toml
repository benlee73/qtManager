[workspace]
members = [
  "crates/qt-application",
  "crates/qt-domain",
  "crates/qt-infrastructure",
  "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97.1"
version = "0.4.0"

[workspace.dependencies]
calamine = "0.36.0"
qt-application = { path = "crates/qt-application" }
qt-domain = { path = "crates/qt-domain" }
qt-infrastructure = { path = "crates/qt-infrastructure" }
rusqlite = { version = "0.40.1", features = ["bundled", "functions"] }
rust_xlsxwriter = "0.96.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = "2.11.5"
tempfile = "3.23"
thiserror = "2.0"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
uuid = { version = "1.18.1", features = ["v4"] }
