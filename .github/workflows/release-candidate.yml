name: release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: qt-manager-macos-universal
          - os: windows-2025
            artifact: qt-manager-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}
      - uses: extractions/setup-just@v3
      - run: pnpm install --frozen-lockfile
      - run: just check
      - run: just e2e
      - name: Build macOS Universal DMG
        if: runner.os == 'macOS'
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg
      - name: Verify macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path="$(find target/universal-apple-darwin/release/bundle/macos -name '*.app' -maxdepth 1 -print -quit)"
          dmg_path="$(find target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -maxdepth 1 -print -quit)"
          test -n "$app_path"
          test -n "$dmg_path"
          lipo "$app_path/Contents/MacOS/qt-manager" -verify_arch x86_64 arm64
          hdiutil verify "$dmg_path"
      - name: Build Windows NSIS installer
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles nsis
      - name: Verify Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if ($null -eq $installer -or $installer.Length -le 0) {
            throw "Windows NSIS installer was not created."
          }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -PassThru -Wait
          if ($install.ExitCode -ne 0) {
            throw "Windows NSIS silent installation failed with exit code $($install.ExitCode)."
          }
          $entry = Get-ChildItem "HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall" |
            Get-ItemProperty |
            Where-Object { $_.DisplayName -eq "QT Manager" } |
            Select-Object -First 1
          if ($null -eq $entry -or -not (Test-Path $entry.InstallLocation)) {
            throw "Installed QT Manager location was not registered."
          }
          $application = Get-ChildItem $entry.InstallLocation -Filter *.exe |
            Where-Object { $_.Name -notlike "uninstall*" } |
            Select-Object -First 1
          if ($null -eq $application) {
            throw "Installed QT Manager executable was not found."
          }
          $process = Start-Process -FilePath $application.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Installed QT Manager exited during the launch smoke test."
          }
          Stop-Process -Id $process.Id
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: ${{ matrix.artifact }}
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ${{ matrix.artifact }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
