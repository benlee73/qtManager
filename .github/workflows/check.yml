name: check

on:
  # 무료 Actions 분량을 소진한 기간에는 의도치 않은 과금을 막기 위해
  # 로컬 `just check && just e2e`를 기본으로 하고 필요할 때만 수동 실행한다.
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: extractions/setup-just@v3
      - run: pnpm install --frozen-lockfile
      - run: just check
      - run: just e2e
